name: Build and Push to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'Dockerfile.prod'
      - 'requirements-prod.txt'
      - 'requirements-prod.lock.txt'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vaishakkmenon/rag_personal
          tags: |
            type=sha,prefix=sha-          # tags image with commit SHA
            type=raw,value=latest         # always updates latest tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha           # uses GitHub Actions cache to speed up builds
          cache-to: type=gha,mode=max
